# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  # Gate every branch, not only main (kept from the previous workflow: feature branches
  # without a PR were otherwise untested).
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrapers:
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (requires-python) and a current release.
        python-version: ["3.10", "3.13"]
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: ${{ matrix.python-version }}
      # Installs from uv.lock (uv sync --frozen --all-extras); mypy and ruff come from the dev extra.
      # Ratchet: measured 42.24% on 2026-10-22 (ADR-0004: threshold = measured, rounded down); raise it
      # as tests grow. Below the 80% floor: the legacy scripts are archive-bound (see PRODUCT.md).
      coverage-threshold: "42"
      # Offline only (fixtures and fakes, no live site traffic).
      test-command: python -m pytest -q --cov

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
